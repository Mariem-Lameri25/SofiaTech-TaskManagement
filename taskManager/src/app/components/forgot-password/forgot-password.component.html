<div class="forgot-password-wrapper">
  <!-- Background Decoration -->
  <div class="bg-decoration">
    <div class="decoration-circle circle-1"></div>
    <div class="decoration-circle circle-2"></div>
    <div class="decoration-circle circle-3"></div>
  </div>

  <!-- Main Container -->
  <div class="forgot-password-container">
    <!-- Header Section -->
    <div class="header-section">
      <div class="icon-wrapper">
        <svg class="lock-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M3 8l7.89 7.89a2 2 0 002.83 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
        </svg>
      </div>
      <h1 class="title">Mot de passe oublié ?</h1>
      <p class="subtitle">Saisissez votre adresse e-mail et nous vous enverrons un lien pour réinitialiser votre mot de passe.</p>
    </div>

    <!-- Form Section -->
   <!-- Form Section -->
<form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" class="forgot-form">
  <div class="form-group">
    <label class="form-label" for="email">
      <span class="label-text">Adresse e-mail</span>
      <span class="required-asterisk">*</span>
    </label>
    <div class="input-wrapper">
      <input
        id="email"
        type="email"
        formControlName="email"
        class="form-input"
        [class.error]="forgotForm.controls['email'].invalid && forgotForm.controls['email'].touched"
        placeholder="votre@email.com"
        autocomplete="email"
      />
      <div class="input-icon">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M3 8l7.89 7.89a2 2 0 002.83 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
        </svg>
      </div>
    </div>
    <div 
      *ngIf="forgotForm.controls['email'].invalid && forgotForm.controls['email'].touched" 
      class="field-error"
    >
      Veuillez saisir une adresse e-mail valide.
    </div>
  </div>

  <button type="submit" class="submit-btn" [disabled]="forgotForm.invalid || isLoading" [class.loading]="isLoading">
    <span class="btn-text">{{ isLoading ? 'Envoi en cours...' : 'Envoyer le lien' }}</span>
    <svg class="btn-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
    </svg>
  </button>

  <!-- ✅ Success or Error Messages (INSIDE the form now) -->
  <div class="message-container" *ngIf="message || error">
    <div *ngIf="message" class="success-message">
      <svg class="message-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
      </svg>
      <span>{{ message }}</span>
    </div>
    <div *ngIf="error" class="error-message">
      <svg class="message-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
      </svg>
      <span>{{ error }}</span>
    </div>
  </div>
</form>


    <!-- Footer Section -->
    <div class="footer-section">
      <p class="footer-text">
        Vous vous souvenez de votre mot de passe ? 
        <a [routerLink]="['/login']" class="footer-link" style="cursor:pointer;text-decoration:underline;"><span>Se connecter</span></a>
      </p>
    </div>
  </div>
</div>
