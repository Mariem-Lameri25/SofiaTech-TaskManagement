<!-- sidebar.component.html -->
<div class="sidebar">
  <div class="sidebar-content">
    <div class="logo">
      <i class="fas fa-clipboard-list logo-icon"></i>
      <span class="logo-text">Task Manager</span>
    </div>
    
    <ul class="nav-list">
      <li routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"><a [routerLink]="['/dashboard']"><i class="fas fa-tv"></i> Dashboard</a></li>
      
      <li routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"><a [routerLink]="['/users']"><i class="fas fa-users text-primary"></i> Users</a></li>
      <li routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"><a [routerLink]="['/projects']"><i class="fas fa-project-diagram text-danger"></i> Projects</a></li>
      <li routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"><a [routerLink]="['/tasks']"><i class="fa fa-tasks text-pink" aria-hidden="true"></i> Tasks</a></li>
    </ul>
    
    <div class="divider"></div>
    
    <div class="doc-section">
      <p class="doc-title">Settings</p>
      <ul class="nav-list">
        <li routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"><a [routerLink]="['/getting-started']"><i class="fas fa-rocket text-muted"></i> Profile settings</a></li>
        
      </ul>
    </div>
    
    <!-- Sidebar footer with logout button -->
    <div class="sidebar-footer">
      <button class="btn logout-btn w-100" (click)="logout()">
        <i class="fas fa-sign-out-alt me-2"></i> Logout
      </button>
    </div>
  </div>
</div>
