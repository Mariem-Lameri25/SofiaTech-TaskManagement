<div class="reset-password-wrapper">
  <div class="reset-password-container">
    <!-- Header Section -->
    <div class="header-section">
      <div class="icon-wrapper">
        <svg class="lock-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M18 11H6a2 2 0 00-2 2v7a2 2 0 002 2h12a2 2 0 002-2v-7a2 2 0 00-2-2zM7 11V7a5 5 0 0110 0v4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1 class="title">Nouveau mot de passe</h1>
      <p class="subtitle">Créez un mot de passe sécurisé pour votre compte</p>
    </div>

    <!-- Form Section -->
    <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="reset-form">
      <!-- Password Field -->
      <div class="form-group">
        <label for="password" class="form-label">
          <span class="label-text">Nouveau mot de passe</span>
          <span class="required-asterisk">*</span>
        </label>
        <div class="input-wrapper">
          <input 
            id="password" 
            type="password" 
            formControlName="password"
            class="form-input"
            [class.error]="hasError('password')"
            placeholder="Entrez votre nouveau mot de passe"
            (input)="onInputChange()"
          />
          <div class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke="currentColor" stroke-width="2"/>
              <path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" stroke="currentColor" stroke-width="2"/>
            </svg>
          </div>
        </div>
        <div class="field-hint">Minimum 6 caractères</div>
        <div class="field-error" *ngIf="hasError('password')">
          {{ getErrorMessage('password') }}
        </div>
      </div>

      <!-- Confirm Password Field -->
      <div class="form-group">
        <label for="confirmPassword" class="form-label">
          <span class="label-text">Confirmer le mot de passe</span>
          <span class="required-asterisk">*</span>
        </label>
        <div class="input-wrapper">
          <input 
            id="confirmPassword" 
            type="password" 
            formControlName="confirmPassword"
            class="form-input"
            [class.error]="hasError('confirmPassword') || (confirmPasswordControl?.value && !passwordsMatch)"
            placeholder="Confirmez votre mot de passe"
            (input)="onInputChange()"
          />
          <div class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M21 12c0 4.97-4.03 9-9 9s-9-4.03-9-9 4.03-9 9-9 9 4.03 9 9z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>
        <div class="field-error" *ngIf="hasError('confirmPassword')">
          {{ getErrorMessage('confirmPassword') }}
        </div>
        <div class="field-error" *ngIf="confirmPasswordControl?.value && !passwordsMatch && !hasError('confirmPassword')">
          Les mots de passe ne correspondent pas
        </div>
      </div>

      <!-- Submit Button -->
      <button 
        type="submit" 
        class="submit-btn" 
        [disabled]="resetForm.invalid || !passwordsMatch || isLoading"
        [class.loading]="isLoading"
      >
        <span class="btn-text">
          {{ isLoading ? 'Réinitialisation...' : 'Réinitialiser le mot de passe' }}
        </span>
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" *ngIf="!isLoading">
          <path d="M5 12h14m-7-7l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" *ngIf="isLoading">
          <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <!-- Messages -->
      <div class="message-container">
        <div class="success-message" *ngIf="message">
          <svg class="message-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
          </svg>
          <span>{{ message }}</span>
        </div>
        
        <div class="error-message" *ngIf="error">
          <svg class="message-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
            <line x1="15" y1="9" x2="9" y2="15" stroke="currentColor" stroke-width="2"/>
            <line x1="9" y1="9" x2="15" y2="15" stroke="currentColor" stroke-width="2"/>
          </svg>
          <span>{{ error }}</span>
        </div>
      </div>
    </form>

    <!-- Footer -->
    <div class="footer-section">
      <p class="footer-text">
        Vous vous souvenez de votre mot de passe ? 
        <a routerLink="/login" class="footer-link">Se connecter</a>
      </p>
    </div>
  </div>

  <!-- Background Decoration -->
  <div class="bg-decoration">
    <div class="decoration-circle circle-1"></div>
    <div class="decoration-circle circle-2"></div>
    <div class="decoration-circle circle-3"></div>
  </div>
</div>
