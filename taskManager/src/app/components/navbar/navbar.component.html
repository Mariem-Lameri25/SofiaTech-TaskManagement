<!-- Blur Background Overlay -->
<div class="blur-overlay" *ngIf="showNotifications" (click)="showNotifications = false"></div>

<header class="navbar navbar-expand-lg custom-navbar px-4">
  <!-- Search Form - positioned to the left -->
  <form class="search-form" >
    <div class="input-group">
      <input
        type="text"
        #searchInput
        class="form-control search-input"
        placeholder="Search"
        aria-label="Search"
      />
      <button class="btn search-btn" type="submit">Search</button>
    </div>
  </form>

  <!-- Spacer to push items to the right -->
  <div class="ms-auto d-flex align-items-center">
    <!-- Notification Icon -->
    <div class="notification-section me-3 position-relative">
      <button class="btn notification-btn" (click)="onNotificationClick()">
        <i class="fas fa-bell"></i>
        <span class="notification-badge" *ngIf="notificationCount > 0">{{ notificationCount }}</span>
      </button>

      <!-- Dropdown notifications -->
      <div class="notification-dropdown" *ngIf="showNotifications">

        <div class="dropdown-header d-flex justify-content-between align-items-center px-3 py-2 ">
          <strong>Notifications</strong>
          <div>
            <button class="btn btn-sm btn-link p-0 me-2" (click)="markAllAsRead()">Tout marquer comme lu</button>
            <button class="btn btn-sm btn-link p-0" (click)="showNotifications = false">Fermer</button>
          </div>
        </div>

        <div class="notification-list" (scroll)="onScrollEvent($event)">

          

          <ng-container *ngIf="notifications.length > 0; else noNotifications">
            <div *ngFor="let notif of notifications" class="notification-item">
              <p class="mb-1">{{ notif.contenu }}</p>
              <small class="text-muted">{{ notif.dateCreation | date:'short' }}</small>
              <div class="mt-1">
                <button class="btn btn-sm btn-link p-0" (click)="markAsRead(notif.id)">Marquer comme lue</button>
              </div>
            </div>
          </ng-container>

          <ng-template #noNotifications>
            <div class="no-notifications p-3 text-center">Aucune notification</div>
          </ng-template>

        </div>

        <!-- Pagination buttons (visible si usePagingButtons = true) -->
        <div *ngIf="usePagingButtons" class="pagination d-flex justify-content-between align-items-center px-3 py-2">
          <button class="btn btn-sm" (click)="prevPage()" [disabled]="page === 1">Précédent</button>
          <span>Page {{ page }} / {{ lastPage }}</span>
          <button class="btn btn-sm" (click)="nextPage()" [disabled]="page === lastPage">Suivant</button>
        </div>

      </div>
    </div>


    <!-- User Profile Section -->
    <div class="profile-section d-flex align-items-center">
      <div class="profile-info d-flex align-items-center me-3">
        <img
[src]="profileImage"
alt="Profile"
class="profile-avatar rounded-circle me-2"
width="36"
height="36"
(click)="goToProfile()"
style="cursor: pointer"
/>

       <!-- Afficher uniquement si username est défini -->
<span class="username" *ngIf="username; else loadingUsername">{{ username }}</span>
<ng-template #loadingUsername>
  <span class="username">Chargement...</span>
</ng-template>

      </div>
      <button class="logout-btn" (click)="onLogout()">Logout</button>

    </div>
  </div>
</header>
